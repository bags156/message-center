name: Android build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed APK release for Obtainium
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Try music link matching against the real services (printed only)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mkdir -p "$RUNNER_TEMP/music"
          curl -fsSL -o "$RUNNER_TEMP/music/json.jar" https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          javac -nowarn -d "$RUNNER_TEMP/music" -cp "$RUNNER_TEMP/music/json.jar" app/src/main/java/io/github/bags156/messagecenter/MusicLinks.java tools/MusicProbe.java
          java -cp "$RUNNER_TEMP/music:$RUNNER_TEMP/music/json.jar" io.github.bags156.messagecenter.MusicProbe | sed 's/^/MUSIC /'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: bridge/go.sum
      - name: Test and build the on-device protocol bridge
        working-directory: bridge
        run: |
          go test -race ./...
          go vet ./...
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-35"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          mkdir -p ../app/libs
          gomobile bind -target android/arm64,android/amd64 -androidapi 33 -javapkg io.github.bags156.gm -o ../app/libs/messagebridge.aar .
          go mod vendor
          tar -czf dependencies-source.tar.gz vendor go.mod go.sum heic
      - name: Test release update rules
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test, lint, and build Android APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify native libraries for 16 KB Android pages
        run: python3 tools/check_apk_native_alignment.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-smoke-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-source
          path: bridge/dependencies-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

  device-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: device-smoke-apks
          path: apks
      - name: Launch Android emulator and run offline checks
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/message-center-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name message-center-test --path "$ANDROID_AVD_HOME/message-center-test.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          test -f "$ANDROID_AVD_HOME/message-center-test.ini"
          "$ANDROID_HOME/emulator/emulator" -avd message-center-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          # No "isn't responding" dialogs from a slow emulator over the screen under test.
          adb shell settings put global hide_error_dialogs 1 || true
          adb install apks/debug/app-debug.apk
          adb install apks/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w io.github.bags156.messagecenter.test/io.github.bags156.messagecenter.OnDeviceSmoke | tee device-test.txt
          # What the on-device checks noted and pictured (printed even when a check failed).
          set +e
          adb exec-out run-as io.github.bags156.messagecenter cat cache/probe.txt | sed 's/^/PROBE /'
          for shot in $(adb exec-out run-as io.github.bags156.messagecenter cat cache/shots.txt | tr -d '\r' | grep '^shot-' | sort -u); do
            adb exec-out run-as io.github.bags156.messagecenter cat "cache/$shot.png" > "$shot.png"
            python3 -c "import sys; from PIL import Image; im=Image.open(sys.argv[1]).convert('RGB'); im.thumbnail((486,1080)); im.save(sys.argv[2],quality=70)" "$shot.png" "$shot.jpg" 2>/dev/null || cp "$shot.png" "$shot.jpg"
            echo "SHOT_BEGIN $shot"; base64 -w 120 "$shot.jpg" | sed 's/^/SHOT /'; echo "SHOT_END"
          done
          set -e
          grep -q MESSAGE_CENTER_SMOKE_PASS device-test.txt
          adb shell am start -n io.github.bags156.messagecenter/.PairedActivity
          adb shell screencap -p /sdcard/message-center.png
          adb pull /sdcard/message-center.png
          adb exec-out run-as io.github.bags156.messagecenter cat cache/group-bubble-preview.png > group-bubble-preview.png
          # Settings screenshots for reviewing the UI (best effort; printed small in the log too).
          set +e
          for shot in chat-menu chat-menu-dark inbox-menu inbox-menu-dark dialog dialog-dark settings-home settings-notifications settings-search note-editor notes-list notes-list-black note-editor-black settings-black swipe-3 swipe-12 swipe-redraw swipe-after; do
            adb exec-out run-as io.github.bags156.messagecenter cat "cache/$shot.png" > "$shot.png"
            python3 -c "import sys; from PIL import Image; im=Image.open(sys.argv[1]).convert('RGB'); im.thumbnail((486,1080)); im.save(sys.argv[2],quality=70)" "$shot.png" "$shot.jpg" 2>/dev/null || cp "$shot.png" "$shot.jpg"
            echo "SHOT_BEGIN $shot"; base64 -w 120 "$shot.jpg" | sed 's/^/SHOT /'; echo "SHOT_END"
          done
          adb shell am start -S -n io.github.bags156.messagecenter/.PairedActivity --es open settings
          sleep 5
          for i in 1 2 3; do
            adb exec-out screencap -p > "settings-$i.png"
            python3 -c "import sys,zlib; d=open(sys.argv[1],'rb').read(); print(len(d))" "settings-$i.png"
            if command -v convert >/dev/null; then convert "settings-$i.png" -resize 45% -quality 70 "settings-$i.jpg"; else cp "settings-$i.png" "settings-$i.jpg"; fi
            echo "SHOT_BEGIN settings-$i"; base64 -w 120 "settings-$i.jpg" | sed 's/^/SHOT /'; echo "SHOT_END"
            adb shell input swipe 540 1900 540 700 500; sleep 2
          done
          set -e
      - name: Collect Android diagnostics
        if: always()
        run: '"$ANDROID_HOME/platform-tools/adb" logcat -d -s AndroidRuntime > android-runtime.txt || true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-smoke-report
          path: |
            device-test.txt
            message-center.png
            group-bubble-preview.png
            settings-*.png
            chat-menu*.png
            inbox-menu*.png
            dialog*.png
            note*.png
            android-runtime.txt
            emulator.log
          retention-days: 14

  release:
    needs: [build, device-smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-apk
          path: unsigned
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dependency-source
          path: dependency-source
      - name: Check version and previous release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out previous
          gh api "repos/$GITHUB_REPOSITORY/releases" > previous/releases.json
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("previous/releases.json")) else 1)'; then
            PREVIOUS_TAG="$(python3 -c 'import json; print(next(r["tag_name"] for r in json.load(open("previous/releases.json")) if not r["draft"]))')"
            gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-metadata.json --dir previous
            python3 tools/release_metadata.py --previous previous/release-metadata.json --output out/release-metadata.json
          else
            python3 tools/release_metadata.py --output out/release-metadata.json
          fi
      - name: Install Android signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Sign and verify APK
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: python3 tools/sign_apk.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("out/release-metadata.json"))["versionName"])')"
          cp signing-certificate.sha256 out/
          cp dependency-source/dependencies-source.tar.gz out/
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease --latest=false); fi
          (cd out && sha256sum message-center.apk > SHA256SUMS)
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${FLAGS[@]}" \
            --title "Message Center $VERSION" --notes-file docs/release-notes.md \
            out/message-center.apk out/SHA256SUMS out/signing-certificate.sha256 out/release-metadata.json out/dependencies-source.tar.gz
