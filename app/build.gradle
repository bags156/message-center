plugins { id 'com.android.application' }

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }

android {
    namespace 'io.github.bags156.messagecenter'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.bags156.messagecenter'
        minSdk 33
        targetSdk 35
        versionCode appVersion.versionCode.toInteger()
        versionName appVersion.versionName
        testInstrumentationRunner 'io.github.bags156.messagecenter.OnDeviceSmoke'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Media3's effect library pulls in Lottie (animated overlays) and with it AppCompat; nothing here uses them.
configurations.configureEach { exclude group: 'com.airbnb.android', module: 'lottie' }

dependencies {
    implementation files('libs/messagebridge.aar')
    // Re-encodes videos to a sendable size with the phone's own encoder (see VideoPrep). Apache-2.0.
    implementation 'androidx.media3:media3-transformer:1.9.3'
    implementation 'androidx.media3:media3-effect:1.9.3'
    implementation 'androidx.media3:media3-common:1.9.3'
    // Picture text search: Tesseract OCR (Apache-2.0; Leptonica, libpng and libjpeg are permissive too).
    // Open source and offline, so it fits the AGPL and sends nothing anywhere. Model: assets/tessdata.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    // React with any emoji: Android's own emoji picker (categories, skin tones, recents). Apache-2.0, offline.
    implementation 'androidx.emoji2:emoji2-emojipicker:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
