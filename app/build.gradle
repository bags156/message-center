plugins { id 'com.android.application' }

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }

android {
    namespace 'io.github.bags156.messagecenter'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.bags156.messagecenter'
        minSdk 33
        targetSdk 35
        versionCode appVersion.versionCode.toInteger()
        versionName appVersion.versionName
        testInstrumentationRunner 'io.github.bags156.messagecenter.OnDeviceSmoke'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/messagebridge.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
