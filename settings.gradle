pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        // Tesseract4Android is published only on JitPack (built from its tagged GitHub source); nothing else comes from there.
        maven { url 'https://jitpack.io'; content { includeGroup 'cz.adaptech.tesseract4android' } }
    }
}
rootProject.name = 'MessageCenter'
include ':app'
